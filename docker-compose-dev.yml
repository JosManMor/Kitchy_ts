services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: kitchy_backend_gc_dev
    env_file:
      - ./.env
    ports:
      - ${BACKEND_PORT}:3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  postgres:
    image: postgres:18.3-alpine
    container_name: kitchy_postgres_gc_dev
    restart: always
    env_file:
      - ./.env
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: kitchy_pgadmin_gc_dev
    restart: always
    env_file:
      - ./.env
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  # frontend:
  #   build:
  #     context: ./public-html/app_front
  #     dockerfile: Dockerfile.dev
  #   container_name: frontend_gc_dev
  #   ports:
  #     - "5173:5173"
